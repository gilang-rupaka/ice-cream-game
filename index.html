<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Supply Chain Games: Ice Cream</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: slim navy header with zoom tools. Desktop stage = day column (card + ready list + run button) beside the road, team cards in one row below, fitted to one projector screen. Phone = stacked, team tabs, run button docked at the bottom. Poltrada Bali tokens. */
:root{
  --navy-950:#1a2233; --navy-900:#1f3864; --navy-700:#2c4c82;
  --surface:#ffffff; --surface-tint:#eef2f8; --surface-tint-2:#e7ecf6;
  --surface-inverse:#1f3864; --border:#d3dbea; --border-strong:#8f9bb0;
  --ink:#1a2233; --ink-heading:#1f3864; --ink-muted:#434b58;
  --ink-inverse:#ffffff; --ink-inverse-muted:#b4c2db; --ink-inverse-soft:#d3dcec;
  --accent:#c9a227; --accent-text:#7a5f12; --link:#1861ac; --logo-gold:#fcbd00;
  --danger:#a8391f; --success:#2f6b4b; --melt:#e2477f;
  --road:#b9c3d4; --road-line:#ffffff;
  --tc1:#8a4b2a; --tc2:#c4621a; --tc3:#2f7a52; --tc4:#8a6d1a; --tc5:#1861ac; --tc6:#6b4aa8; --tc7:#b3364a; --tc8:#13808a;
  --serif:Fredoka, "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --sans:Nunito, "Segoe UI", Arial, system-ui, sans-serif;
  --r-sm:4px; --r-md:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface:#121a29; --surface-tint:#1b2638; --surface-tint-2:#22304a; --surface-inverse:#1f3864;
  --border:#2c3a52; --border-strong:#6b7a95; --ink:#eef2f8; --ink-heading:#eef2f8; --ink-muted:#b8c4d8;
  --accent:#e0b43a; --accent-text:#e8c25a; --link:#7aa7e0; --danger:#f08a6c; --success:#7fd0a4; --melt:#ff7aa8;
  --road:#3a4964; --road-line:#9fb0cc;
  --tc1:#d9946a; --tc2:#f0a05a; --tc3:#6fbf94; --tc4:#e0b43a; --tc5:#7aa7e0; --tc6:#b39ae8; --tc7:#f08a9c; --tc8:#5cc6cf; color-scheme:dark}}
:root[data-theme="dark"]{
  --surface:#121a29; --surface-tint:#1b2638; --surface-tint-2:#22304a; --surface-inverse:#1f3864;
  --border:#2c3a52; --border-strong:#6b7a95; --ink:#eef2f8; --ink-heading:#eef2f8; --ink-muted:#b8c4d8;
  --accent:#e0b43a; --accent-text:#e8c25a; --link:#7aa7e0; --danger:#f08a6c; --success:#7fd0a4; --melt:#ff7aa8;
  --road:#3a4964; --road-line:#9fb0cc;
  --tc1:#d9946a; --tc2:#f0a05a; --tc3:#6fbf94; --tc4:#e0b43a; --tc5:#7aa7e0; --tc6:#b39ae8; --tc7:#f08a9c; --tc8:#5cc6cf; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--surface);color:var(--ink)}
body{font-family:var(--sans);font-size:17px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface-inverse)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1600px;margin:0 auto}
h2,h3{font-family:var(--serif);font-weight:600;color:var(--ink-heading);margin:0;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin:0}
.hint{color:var(--ink-muted);font-size:15px;margin:0}

/* header */
header.band{background:var(--surface-inverse);color:var(--ink-inverse)}
.hdr{padding-block:8px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 320px}
.brand img{width:42px;height:42px;flex:none;background:#fff;border-radius:50%}
.brand .inst{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-inverse-soft);font-weight:800}
.brand h1{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(20px,2.3vw,28px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-day{font-family:var(--serif);font-weight:700;font-size:18px;border:2px solid var(--accent);color:var(--logo-gold);border-radius:999px;padding:2px 12px;white-space:nowrap}
.hbtn{background:transparent;border:1px solid var(--ink-inverse-muted);color:var(--ink-inverse);border-radius:var(--r-md);padding:6px 11px;font-size:15px;font-weight:700;min-height:36px}
.hbtn:hover{border-color:var(--logo-gold)}
.zoom{display:flex;align-items:center;border:1px solid var(--ink-inverse-muted);border-radius:var(--r-md);overflow:hidden}
.zoom button{background:transparent;border:0;color:var(--ink-inverse);width:36px;height:34px;font-size:20px;font-weight:800;line-height:1}
.zoom button:hover{background:var(--navy-700)}
.zoom output{min-width:52px;text-align:center;font-size:14px;font-weight:800;color:var(--ink-inverse)}
.zoom .fit{width:auto;padding:0 10px;font-size:14px;border-left:1px solid var(--navy-700)}
.zoom .fit[aria-pressed="true"]{background:var(--logo-gold);color:var(--navy-950)}

main .wrap{padding-block:12px}
#stage{display:grid;gap:12px}

/* restore strip */
.restore{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;background:var(--surface-tint);border:2px solid var(--accent);border-radius:var(--r-md);padding:8px 14px}
.restore p{margin:0}

/* top area */
.top{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:12px}
.daycol{display:grid;gap:10px;align-content:start}
.day{background:var(--surface-inverse);color:var(--ink-inverse);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:8px}
.day-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day .eyebrow{color:var(--logo-gold)}
.day h2{color:var(--ink-inverse);font-size:26px;line-height:1.15}
.day p{margin:0;color:var(--ink-inverse-soft);font-size:15px;line-height:1.4}
.forecast{display:flex;align-items:center;gap:10px;border-top:1px solid var(--navy-700);padding-top:8px}
.forecast .num{font-family:var(--serif);font-weight:700;font-size:40px;color:var(--logo-gold);line-height:1}
.forecast .lbl{font-size:14px;color:var(--ink-inverse-soft);line-height:1.3}
.forecast svg{width:30px;height:30px;flex:none}
.ask{background:var(--navy-700);border-radius:var(--r-md);padding:8px 10px;font-size:15px;line-height:1.35}
.ask b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--logo-gold)}

.run{display:grid;gap:8px}
.readybar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:700;color:var(--ink-heading)}
.readyicons{display:flex;gap:4px}
.readyicons .fruit{opacity:.35;filter:grayscale(1)}
.readyicons .fruit.on{opacity:1;filter:none;border-color:var(--success);box-shadow:0 0 0 2px var(--success)}
.primary{width:100%;justify-content:center;background:var(--surface-inverse);color:var(--ink-inverse);border:2px solid var(--surface-inverse);border-radius:var(--r-md);padding:10px 16px;font-size:20px;font-weight:800;display:inline-flex;gap:10px;align-items:center;font-family:var(--serif)}
.primary .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--logo-gold);color:var(--logo-gold);font-size:15px}
.primary:hover:not(:disabled){background:var(--navy-700);border-color:var(--navy-700)}
.primary:disabled{opacity:.6;cursor:wait}
.secondary{background:var(--surface);color:var(--ink-heading);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:8px 14px;font-weight:800}
.secondary:hover{background:var(--surface-tint)}

/* road */
.road{border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;display:grid;gap:8px;min-width:0;align-content:start}
.road-head{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.station{display:flex;align-items:center;gap:6px;white-space:nowrap}
.station svg{width:28px;height:28px;flex:none}
.road-head .mid{text-align:center}
.road-head .end{justify-content:flex-end}
.lane{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center}
.who{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0}
.nm-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.track{position:relative;height:40px;background:var(--road);border-radius:var(--r-sm);overflow:hidden}
.track::after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:2px dashed var(--road-line);opacity:.9}
.truck{position:absolute;left:4px;top:3px;height:34px;display:flex;align-items:center;gap:4px;z-index:2;transition:transform 2.4s cubic-bezier(.45,.05,.4,1)}
.truck.arrived{left:auto;right:4px}
.truck svg{height:32px;width:auto;filter:drop-shadow(0 0 1px var(--surface))}
.load{font-weight:800;font-size:15px;background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:0 6px;border:1px solid var(--border-strong)}
.meltchip{font-weight:800;font-size:14px;background:var(--melt);color:#fff;border-radius:999px;padding:0 8px}
.drops{position:absolute;inset:0;pointer-events:none;z-index:1}
.drop{position:absolute;top:10px;width:13px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--melt);border:2px solid var(--surface);opacity:0;animation:drip 1.1s ease-in forwards}
@keyframes drip{0%{opacity:0;transform:translateY(-4px) scale(.6)}25%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:.95;transform:translateY(14px) scale(1.5,.55)}}
.sold{font-size:13px;text-align:right;color:var(--ink-muted);line-height:1.1}
.sold b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink-heading)}
.closed-note{position:relative;z-index:2;margin:4px;height:32px;display:grid;place-items:center;font-weight:800;color:var(--ink-muted);background:var(--surface-tint);border-radius:var(--r-sm)}
.evstrip{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);padding-top:8px;font-size:15px}
.evstrip .badge{width:30px;height:30px;border-radius:50%;background:var(--surface-inverse);display:grid;place-items:center;flex:none}
.evstrip .badge svg{width:18px;height:18px}
.evstrip b{color:var(--ink-heading)}

.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border);padding-top:8px;font-size:14px;color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
body.dim main,body.dim footer{filter:blur(3px)}
/* event reveal */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(15,22,38,.62);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.evcard{width:min(640px,100%);background:var(--surface);border:4px solid var(--accent);border-radius:12px;padding:24px;display:grid;gap:14px;justify-items:center;text-align:center;animation:flip .6s ease-out}
@keyframes flip{from{transform:perspective(800px) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
.evcard .badge{width:88px;height:88px;border-radius:50%;background:var(--surface-inverse);display:grid;place-items:center}
.evcard .badge svg{width:52px;height:52px}
.evcard h2{font-size:clamp(26px,4vw,38px);line-height:1.15}
.evcard p{margin:0;font-size:clamp(17px,2vw,21px);color:var(--ink)}
.hit{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-weight:800;color:var(--ink-heading)}
.hit .tag{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--danger);color:var(--danger);border-radius:999px;padding:2px 10px 2px 4px}
.evcard .primary{max-width:360px}

.sml{display:none}
.hbtn.icon{width:38px;padding:0;display:inline-grid;place-items:center}
.hbtn.icon svg{width:22px;height:22px}
.hbtn.icon[aria-pressed="true"]{background:var(--danger);border-color:var(--danger)}
.pop{position:fixed;z-index:40;width:min(300px,calc(100vw - 16px));background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);border-radius:10px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 8px 24px rgba(15,22,38,.25)}
.pop-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--ink-heading)}
.sw{width:46px;height:26px;border-radius:999px;border:0;background:var(--border-strong);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--success)}
#swMute[aria-checked="true"]{background:var(--danger)}
.sw[aria-checked="true"]::after{left:23px}
.vol{display:grid;grid-template-columns:auto 1fr 44px;gap:8px;align-items:center;font-size:14px;font-weight:700;color:var(--ink-muted)}
.vol input{width:100%;accent-color:var(--navy-700)}
.vol input:disabled{opacity:.4}
.vol output{text-align:right;font-weight:800;color:var(--ink)}
.hbtn.snd[aria-pressed="false"]{color:var(--ink-inverse-muted);border-style:dashed}
.undo{background:transparent;border:0;color:var(--ink-muted);font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:4px 0;justify-self:center}
.undo:hover{color:var(--danger)}
.undo.armed{color:var(--danger)}
.undo-row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
/* chart */
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:560px;height:auto}
.ch-grid{stroke:var(--border);stroke-width:1}
.ch-axis{fill:var(--ink-muted);font-family:var(--sans);font-size:13px;font-weight:700}
.ch-day{fill:var(--ink-muted);font-family:var(--sans);font-size:12px}
.ch-band{fill:var(--surface-tint-2)}
.ch-band-t{fill:var(--accent-text);font-family:var(--sans);font-size:12px;font-weight:800}
.ch-end{font-family:var(--serif);font-size:15px;font-weight:700}
.ch-base{stroke:var(--border-strong);stroke-dasharray:4 4}
.ch-legend{display:flex;gap:8px 18px;flex-wrap:wrap}
.ch-legend span{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
.ch-legend i{display:inline-block;width:22px;height:4px;border-radius:2px}
/* settings sheet */
.sheet{width:min(960px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border-radius:12px;padding:18px 20px;display:grid;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end}
.set-row label{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--ink-muted)}
.set-row select{font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.names{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--border)}
.names-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.name-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px}
.nm{display:flex;align-items:center;gap:8px;min-width:0}
.nmwrap{display:grid;gap:6px;min-width:0}
.name-grid{align-items:start}
.pickbtn{display:inline-flex;align-items:center;gap:2px;background:transparent;border:1px solid var(--border-strong);border-radius:999px;padding:2px 6px 2px 2px;flex:none}
.pickbtn:hover,.pickbtn[aria-expanded="true"]{border-color:var(--navy-700);background:var(--surface-tint)}
.pickbtn .caret{font-size:11px;color:var(--ink-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.emopick{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px;padding:6px;background:var(--surface-tint);border-radius:var(--r-md)}
.emo-opt{height:36px;border:1px solid transparent;border-radius:var(--r-sm);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.emo-opt svg{width:24px;height:24px}
.emo-opt:hover{border-color:var(--navy-700)}
.emo-opt.on{border-color:var(--success);box-shadow:0 0 0 2px var(--success)}
.fruit.emo{font-size:19px;line-height:1;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.fruit.lg.emo{font-size:26px}
.nm input{flex:1;min-width:0;font:inherit;font-size:17px;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 20px;padding-top:12px;border-top:1px solid var(--border);font-size:15px}
.rules ul{margin:4px 0 0;padding-left:18px;list-style:square}
.rules li::marker{color:var(--accent)}

/* landing */
.landing{display:grid;gap:14px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:16px;align-items:stretch;background:var(--surface-inverse);color:var(--ink-inverse);border-radius:12px;padding:20px 22px}
.hero .eyebrow{color:var(--logo-gold)}
.hero h2{color:var(--ink-inverse);font-size:clamp(24px,3vw,36px);line-height:1.15;margin-top:6px}
.hero-txt p:last-child{color:var(--ink-inverse-soft);max-width:60ch;margin:10px 0 0}
.resume{background:var(--surface);color:var(--ink);border-radius:10px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.resume .eyebrow{color:var(--accent-text)}
.resume-t{margin:0;font-family:var(--serif);font-weight:700;font-size:22px;color:var(--ink-heading)}
.resume .hint{margin:0}
.secondary.wide{width:100%;padding:10px 14px}
.secondary.danger{border-color:var(--danger);color:var(--danger)}
.set-block{border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.set-block h3{font-size:19px}
.lv-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lv-card{display:grid;gap:4px;text-align:left;border:2px solid var(--border-strong);border-radius:10px;background:var(--surface);padding:12px 14px}
.lv-card:hover{border-color:var(--navy-700)}
.lv-card[aria-pressed="true"]{border-color:var(--surface-inverse);background:var(--surface-inverse)}
.lv-n{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink-heading)}
.lv-j{font-weight:800;font-size:15px;color:var(--accent-text)}
.lv-d{font-size:14px;color:var(--ink-muted);line-height:1.35}
.lv-card[aria-pressed="true"] .lv-n{color:var(--ink-inverse)}
.lv-card[aria-pressed="true"] .lv-j{color:var(--logo-gold)}
.lv-card[aria-pressed="true"] .lv-d{color:var(--ink-inverse-soft)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;justify-self:start}
.seg button{border:0;background:var(--surface);padding:9px 20px;font-weight:800;font-size:16px;color:var(--ink-heading)}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button[aria-pressed="true"]{background:var(--surface-inverse);color:var(--ink-inverse)}
.landing .names{border-top:0;padding-top:0}
.rules-box summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.rules-box summary::before{content:"▸";color:var(--accent);font-size:16px}
.rules-box[open] summary::before{content:"▾"}
.rules-box summary h3{display:inline}
.landing .rules{border-top:0;padding-top:0}
body.on-landing #btnChart,body.on-landing #btnSettings,body.on-landing .chip-day{display:none}
.landing .names-head h3{display:none}
/* teams */
.tabs{display:none}
.teams{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:12px}
.team{border:1px solid var(--border);border-radius:var(--r-md);display:grid;grid-template-rows:auto 1fr;min-width:0;overflow:hidden}
.team.ready{border-color:var(--success);box-shadow:0 0 0 1px var(--success)}
.team-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-tint);border-top:5px solid var(--tc)}
.team-head h3{display:flex;gap:8px;align-items:center;font-size:19px;min-width:0}
.team-head h3 span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.koin{display:flex;align-items:center;gap:4px;font-family:var(--serif);font-weight:700;font-size:22px;color:var(--ink-heading);white-space:nowrap}
.koin svg{width:22px;height:22px}
.team-body{padding:10px 12px;display:grid;gap:10px;align-content:start}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stock{display:flex;gap:12px;font-size:14px;color:var(--ink-muted)}
.stock b{color:var(--ink);font-size:15px}
.stock .in{font-size:12px;font-weight:800;color:var(--success);background:var(--surface-tint);border-radius:999px;padding:0 6px}
.readybtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--border-strong);background:var(--surface);color:var(--ink-muted);border-radius:999px;padding:2px 12px 2px 6px;font-size:14px;font-weight:800;min-height:32px}
.readybtn svg{width:18px;height:18px}
.readybtn[aria-pressed="true"]{background:var(--success);border-color:var(--success);color:#fff}
.field-lbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:4px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.stepper button{height:40px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-md);font-size:24px;font-weight:800;color:var(--ink-heading)}
.stepper button:hover:not(:disabled){border-color:var(--navy-700);background:var(--surface-tint)}
.stepper output{text-align:center;font-family:var(--serif);font-weight:700;font-size:28px;color:var(--ink-heading);line-height:1}
.stepper output small{display:block;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .stepper{grid-template-columns:32px 1fr 32px;gap:4px}
.pair .stepper button{height:36px;font-size:20px}
.pair .stepper output{font-size:24px}
.pair .stepper output small{font-size:11px}
.pair .auto-note{font-size:12px}
.auto-note{font-size:14px;background:var(--surface-tint);border-radius:var(--r-sm);padding:6px 10px}
.vopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.vopt{display:grid;justify-items:center;gap:2px;text-align:center;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);padding:6px 4px;min-width:0}
.vopt svg.v{width:46px;height:30px}
.vopt .t{font-weight:800;font-size:14px;line-height:1.15;color:var(--ink-heading)}
.vopt .m{font-size:12px;color:var(--ink-muted);line-height:1.25}
.vopt[aria-pressed="true"]{background:var(--surface-inverse);border-color:var(--surface-inverse)}
.vopt[aria-pressed="true"] .t{color:var(--ink-inverse)}
.vopt[aria-pressed="true"] .m{color:var(--ink-inverse-soft)}
.vopt:disabled{cursor:default}
.meter{display:flex;gap:2px;justify-content:center}
.meter svg{width:14px;height:14px}
.ropts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ropt{border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);padding:6px 8px;text-align:left}
.ropt .t{font-weight:800;font-size:14px;color:var(--ink-heading);display:block}
.ropt .m{font-size:12px;color:var(--ink-muted);display:block;line-height:1.25}
.ropt[aria-pressed="true"]{background:var(--surface-inverse);border-color:var(--surface-inverse)}
.ropt[aria-pressed="true"] .t,.ropt[aria-pressed="true"] .m{color:var(--ink-inverse)}

/* level 1 big tiles */
.lv1 .vopt{padding:10px 4px;gap:6px}
.lv1 .vopt svg.v{width:64px;height:40px}
.lv1 .vopt .t{font-size:16px}

/* results */
.result{display:grid;gap:6px}
.rgrid{display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:15px;line-height:1.5}
.rgrid span:nth-child(even){text-align:right;font-weight:800}
.neg{color:var(--danger)}
.rgrid .tot{border-top:1px solid var(--border);padding-top:2px;font-weight:800}
.pill{justify-self:start;font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;border:2px solid currentColor}
.pill.ok{color:var(--success)} .pill.bad{color:var(--danger)} .pill.mid{color:var(--accent-text)}
.bigres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bigres div{display:grid;justify-items:center;gap:2px;background:var(--surface-tint);border-radius:var(--r-md);padding:8px 4px}
.bigres svg{width:30px;height:30px}
.bigres b{font-family:var(--serif);font-size:30px;line-height:1;color:var(--ink-heading)}
.bigres b.neg{color:var(--danger)}
.bigres span{font-size:13px;font-weight:800;color:var(--ink-muted)}

.fruit{display:inline-grid;place-items:center;width:30px;height:30px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:50%}
.fruit svg{width:24px;height:24px}
.fruit.lg{width:40px;height:40px}.fruit.lg svg{width:32px;height:32px}

/* recap */
.recap{display:grid;gap:16px}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.place{border-radius:var(--r-md);padding:14px;background:var(--surface-tint);display:grid;gap:4px;border-top:6px solid var(--tc)}
.place.first{background:var(--surface-inverse);color:var(--ink-inverse)}
.place.first h3,.place.first .big{color:var(--ink-inverse)}
.place .rank{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--accent-text)}
.place.first .rank{color:var(--logo-gold)}
.place .big{font-family:var(--serif);font-weight:700;font-size:34px;color:var(--ink-heading);line-height:1.1}
.place .sub{font-size:14px;color:var(--ink-muted)}
.place.first .sub{color:var(--ink-inverse-soft)}
.debrief{background:var(--surface-tint);border-radius:var(--r-md);padding:14px 16px}
.debrief ol{margin:6px 0 0;padding-left:22px;display:grid;gap:4px}
.tablebox{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:760px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
thead th{background:var(--surface-inverse);color:var(--ink-inverse);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
tbody tr:nth-child(even){background:var(--surface-tint)}
.recap-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.recap-actions .primary{width:auto}
.copybox{width:100%;min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:13px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);padding:8px}

footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px;border-top:1px solid var(--border);font-size:12px;color:var(--ink-muted)}

/* tablet */
@media (max-width:1100px){
  .teams{--cols:2 !important}
}
/* phone */
@media (max-width:699px){
  body{font-size:16px}
  .brand{flex-basis:100%}
  .brand .inst{display:none}
  .brand img{width:34px;height:34px}
  .brand h1{font-size:19px}
  #btnFull,.zoom .fit{display:none}
  .hbtn{padding:5px 9px;font-size:14px}
  .lgl{display:none}.sml{display:inline}
  .chip-day{display:none}
  .tools{flex-wrap:nowrap;gap:6px}
  .zoom button{width:30px}.zoom output{min-width:44px}
  .tools{width:100%;justify-content:space-between}
  .top{grid-template-columns:1fr}
  .day{padding:12px 14px;gap:6px}
  .day h2{font-size:22px}
  .day p.story{display:none}
  .forecast .num{font-size:34px}
  .road{padding:10px}
  .road-head,.lane{grid-template-columns:62px 1fr 44px;gap:6px}
  .road-head .mid{display:none}
  .road-head{grid-template-columns:1fr 1fr}
  .road-head .station span{display:none}
  .legend{font-size:12px;gap:8px}
  .who .nm-txt{display:none}
  .road-head,.lane{grid-template-columns:30px 1fr 46px !important}
  .road-head{grid-template-columns:1fr 1fr !important}
  .who .fruit{width:24px;height:24px}.who .fruit svg{width:19px;height:19px}
  .track{height:34px}
  .truck{height:28px;top:3px}
  .truck svg{height:24px}
  .load{font-size:13px;padding:0 4px}
  .meltchip{font-size:12px;padding:0 5px}
  .sold b{font-size:18px}
  .sold{font-size:11px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  .tab{display:flex;align-items:center;gap:6px;flex:none;border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:3px 12px 3px 4px;font-weight:800;font-size:14px;color:var(--ink-heading)}
  .tab[aria-selected="true"]{background:var(--surface-inverse);color:var(--ink-inverse);border-color:var(--surface-inverse)}
  .tab .ok{width:16px;height:16px}
  .teams{--cols:1 !important}
  .team:not(.active){display:none}
  .run{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:6px}
  .readybar{font-size:13px}
  .primary{font-size:18px;padding:9px 14px}
  footer{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  .evcard{padding:18px}
  .evcard .badge{width:70px;height:70px}.evcard .badge svg{width:40px;height:40px}
  .hero{grid-template-columns:1fr;padding:16px}
  .lv-cards{grid-template-columns:1fr}
  .sheet{align-self:end;border-radius:12px 12px 0 0;max-height:88%}
}
@media (prefers-reduced-motion:reduce){.truck{transition:none}.drop,.evcard{animation:none}}
</style>

function spread(base){ return Math.round(base*.25/5)*5; }
function pickEvent(){
  const tot = EVENTS.reduce((a,e)=>a+e.w,0); let r=Math.random()*tot;
  for(const e of EVENTS){ r-=e.w; if(r<0) return e; } return EVENTS[0];
}
function meltRate(team, day, ev, idx){
  const v=VEH[team.dec.veh]; const route = S.level===3 ? team.dec.route : "utama";
  let m = v.melt*ROUTE[route].mult;
  if(team.dec.veh!=="truk") m += day.heat;
  let add=0;
  if(ev && ev.route && ev.route===route) add=ev.add;
  if(ev && ev.one && idx===S.bocor) add=ev.add;
  m += team.dec.veh==="truk" ? add*.2 : add;
  return Math.min(.9, m);
}

function maxKirim(t){ return Math.min(t.gudang, VEH[t.dec.veh].cap); }
function planKirim(t){
  if(DAYS[S.day].closed) return 0;
  if(S.level===1) return Math.min(DAYS[S.day].base, maxKirim(t));
  return Math.min(t.dec.kirim, maxKirim(t));
}
function canProduce(){ return S.level===3 && S.day < DAYS.length-1; }
function morning(){
  S.teams.forEach(t=>{
    let m = 0;
    if(S.level===3){ m = t.pending||0; t.pending = 0; }
    else if(S.day>0) m = restockFor(S.day);
    t.gudang += m; t.masuk = m;
  });
}
function runDay(){
  const day = DAYS[S.day];
  S.prev = JSON.stringify(Object.assign({}, S, {prev:null}));
  const F = S.forced && S.forced.day===S.day ? S.forced : null;
  let demand, ev;
  if(F){ demand=F.demand; ev=F.event?EVENTS.find(e=>e.id===F.event):null; S.bocor=F.bocor; }
  else {
    demand = day.base;
    if(S.level===3 && demand>0){ const r=spread(day.base); demand = day.base + (Math.floor(Math.random()*3)-1)*r; }
    ev = day.closed ? null : pickEvent();
    if(ev && ev.demandAdd) demand += ev.demandAdd;
    S.bocor = ev && ev.one ? Math.floor(Math.random()*S.n) : -1;
  }
  S.forced = {day:S.day, demand, event: ev?ev.id:null, bocor:S.bocor};
  S.event = ev ? ev.id : null; S.demand = demand;
  S.teams.forEach((t,i)=>{
    const gudangAwal = t.gudang, masuk = t.masuk||0;
    const prod = canProduce() ? t.dec.prod : 0;
    const cost = prod*COST;
    t.pending = prod;
    let kirim=0, leleh=0, tiba=0, sold=0, veh=0, lost=0, melt=0;
    if(!day.closed){
      kirim = planKirim(t);
      t.gudang -= kirim;
      if(kirim>0) veh = VEH[t.dec.veh].cost;
      if(ev && ev.power){ lost=Math.floor(t.toko*.5); t.toko-=lost; }
      melt = meltRate(t, day, ev, i);
      leleh = Math.round(kirim*melt); tiba = kirim-leleh; t.toko += tiba;
      sold = Math.min(t.toko, demand); t.toko -= sold;
    }
    const simpan = S.level===3 ? t.toko*HOLD : 0;
    const income = sold*PRICE, net = income-cost-veh-simpan;
    t.koin += net;
    t.last = {gudangAwal, masuk, prod, kirim, leleh, tiba, sold, demand, lost, cost, veh, simpan, income, net, melt,
      vehName: day.closed||!kirim?"-":VEH[t.dec.veh].name, route: S.level===3?ROUTE[t.dec.route].name:ROUTE.utama.name};
    t.log.push(Object.assign({day:S.day+1, dayName:day.name, event: ev?ev.title:"-", koin:t.koin, gudang:t.gudang, toko:t.toko}, t.last));
  });
}



function affected(ev){
  if(!ev) return [];
  if(ev.route) return S.teams.map((t,i)=>routeOf(t)===ev.route?i:-1).filter(i=>i>=0);
  if(ev.one) return S.bocor>=0?[S.bocor]:[];
  if(ev.power || ev.demandAdd) return S.teams.map((t,i)=>i);
  return [];
}

let AC=null, master=null, sfxBus=null, musBus=null;
function ctx(){
  try{

      master=AC.createGain(); master.connect(AC.destination);
      sfxBus=AC.createGain(); sfxBus.connect(master); musBus=AC.createGain(); musBus.connect(master); applyAudio(); }

function tone(f, at, dur, type, vol, f2){

const MEL=[72,76,79,76,84,79,76,79, 77,81,84,81,77,76,74,72, 74,79,83,79,86,83,79,77, 76,74,72,0,72,74,76,79,

const ROOTS=[[48,55],[41,48],[43,50],[48,55],[45,52],[41,48],[43,50],[48,55]];
const STEP=60/138/2;
let mGain=null, mTimer=null, mNext=0, mStep=0, noiseBuf=null;
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(c, f, t, dur, type, vol, dest){
  const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(vol,t); g.gain.setValueAtTime(vol,t+dur*.7); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(dest); o.start(t); o.stop(t+dur+.02);
}
function noise(c, t, dur, vol, dest, hp){
  if(!noiseBuf){ noiseBuf=c.createBuffer(1, Math.floor(c.sampleRate*.3), c.sampleRate); const d=noiseBuf.getChannelData(0); for(let k=0;k<d.length;k++) d[k]=Math.random()*2-1; }
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=noiseBuf; f.type="highpass"; f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(dest); s.start(t); s.stop(t+dur+.02);
}
function schedule(){
  const c=AC; if(!c || !mGain) return;
  if(mNext < c.currentTime) mNext = c.currentTime + .03;
  while(mNext < c.currentTime + .15){
    const i=mStep%64, bar=Math.floor(i/8), pos=i%8, t=mNext;
    if(MEL[i]) note(c, hz(MEL[i]), t, STEP*.9, "square", .22, mGain);
    if(pos%2===0) note(c, hz(ROOTS[bar][(pos/2)%2]), t, STEP*1.8, "triangle", .5, mGain);
    noise(c, t, .03, .05, mGain, 7000);
    if(pos===2 || pos===6) noise(c, t, .12, .35, mGain, 1500);
    mNext += STEP; mStep++;
  }
}
function startMusic(){
  const c=ctx(); if(!c || mTimer) return;
  mGain=c.createGain(); mGain.gain.value=1; mGain.connect(musBus);
  mNext=c.currentTime+.05; mStep=0; schedule(); mTimer=setInterval(schedule, 40);
}
function stopMusic(){
  clearInterval(mTimer); mTimer=null;
  if(mGain && AC){ const g=mGain; g.gain.setTargetAtTime(0.0001, AC.currentTime, .05); setTimeout(()=>{ try{ g.disconnect(); }catch(e){} }, 400); }
  mGain=null;
}

/* ---------- chart ---------- */
function chartSvg(){
  const W=780,H=330,ml=56,mr=118,mt=18,mb=58, n=DAYS.length;
  const series=S.teams.map(t=>[START].concat(t.log.map(l=>l.koin)));
  const all=series.flat(); let lo=Math.min(0,...all), hi=Math.max(START+50,...all);
  const span=hi-lo, raw=span/5, mag=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const X=d=>ml+d*(W-ml-mr)/n, Y=v=>mt+(hi-v)*(H-mt-mb)/(hi-lo);
  let g="";
  const nyepi=DAYS.findIndex(d=>d.closed);
  if(nyepi>=0) g+=`<rect class="ch-band" x="${X(nyepi+.5)}" y="${mt}" width="${X(1)-X(0)}" height="${H-mt-mb}"/><text class="ch-band-t" x="${X(nyepi+1)}" y="${mt+14}" text-anchor="middle">Nyepi</text>`;
  for(let v=lo; v<=hi+1e-9; v+=step){ g+=`<line class="ch-grid" x1="${ml}" x2="${W-mr+8}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ch-axis" x="${ml-8}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`; }
  g+=`<line class="ch-base" x1="${ml}" x2="${W-mr+8}" y1="${Y(START)}" y2="${Y(START)}"/>`;
  for(let d=0; d<=n; d++){
    g+=`<text class="ch-axis" x="${X(d)}" y="${H-mb+20}" text-anchor="middle">${d===0?"Awal":"H"+d}</text>`;
    if(d>0) g+=`<text class="ch-day" x="${X(d)}" y="${H-mb+38}" text-anchor="middle">${DAYS[d-1].name.replace("Hari Raya ","").replace("Hari ","").replace(" Terik","").replace(" Deras","")}</text>`;
  }
  const ends=series.map((s,i)=>({i, y:Y(s[s.length-1]), v:s[s.length-1], x:X(s.length-1)})).sort((a,b)=>a.y-b.y);
  for(let k=1;k<ends.length;k++) if(ends[k].y-ends[k-1].y<18) ends[k].y=ends[k-1].y+18;
  series.forEach((s,i)=>{
    const c=S.teams[i].c;
    g+=`<polyline fill="none" stroke="${c}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" points="${s.map((v,d)=>X(d)+","+Y(v)).join(" ")}"/>`;
    s.forEach((v,d)=>{ g+=`<circle cx="${X(d)}" cy="${Y(v)}" r="${d===s.length-1?6:4}" fill="${c}" stroke="var(--surface)" stroke-width="2"><title>${esc(S.teams[i].name)} · ${d===0?"Awal":"Hari "+d}: ${v} koin</title></circle>`; });
  });
  ends.forEach(e=>{ g+=`<text class="ch-end" x="${e.x+12}" y="${e.y+5}" fill="${S.teams[e.i].c}">${e.v} · ${esc(S.teams[e.i].name.replace(/^Tim /,""))}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik koin tiap tim per hari">${g}</svg>`;
}

      <div><h3>Koin</h3><ul><li>Setiap tim mulai dengan ${START} koin.</li><li>Menjual 1 kotak: ${PRICE} koin.</li><li>Level 3: biaya simpan di freezer toko ${HOLD} koin per kotak per malam.</li></ul></div>
      <div><h3>Stok gudang</h3><ul><li>Gudang dingin mulai dengan ${STOCK0} kotak.</li><li>Level 1 dan 2: gudang menerima ${RESTOCK_MIN} sampai ${RESTOCK_MAX} kotak setiap pagi mulai Hari 2 sesuai prakiraan.</li><li>Level 3: tim memesan pasokan yang tiba esok pagi. Harga ${COST} koin per kotak.</li><li>Pengiriman maksimal sebesar muatan kendaraan.</li></ul></div>
      <div><h3>Kebutuhan 6 hari</h3><ul><li>Total permintaan: ${DAYS.reduce((s,x)=>s+x.base,0)} kotak per toko.</li><li>Total pasokan Level 1 dan 2: ${STOCK0+DAYS.slice(1).reduce((a,x,k)=>a+restockFor(k+1),0)} kotak.</li><li>Selisih pasokan menutup es krim yang meleleh.</li></ul></div>
      <div><h3>Penyimpanan</h3><ul><li>Permainan tersimpan otomatis di browser ini.</li><li>Buka lagi link yang sama untuk melanjutkan.</li><li>Mode penyamaran tidak menyimpan data.</li></ul></div>
    </div>`;
}
const LVINFO={1:{j:"TK sampai SD kelas 3",d:"Tim memilih kendaraan. Jumlah kiriman otomatis sesuai prakiraan."},
  2:{j:"SD kelas 4 sampai SMP",d:"Tim memilih kendaraan dan jumlah kiriman ke toko."},
  3:{j:"SMA dan SMK",d:"Tim memesan pasokan besok dan mengatur kiriman, kendaraan, serta rute."}};
function landingHtml(){
  const lv = pendLevel||S.level, n = pendN||S.n, prog = hasProgress();
  const leader = prog ? S.teams.slice().sort((a,b)=>b.koin-a.koin)[0] : null;
  const changed = prog && (lv!==S.level || n!==S.n);
  const start = prog
    ? `<div class="resume"><p class="eyebrow">Permainan tersimpan</p>
        <p class="resume-t">Level ${S.level} · ${S.phase==="end"?"Rekap akhir":`Hari ${S.day+1} dari ${DAYS.length}`}</p>
        <p class="hint">${S.n} tim. Skor tertinggi ${esc(leader.name)} dengan ${leader.koin} koin.</p>
        <button class="primary" id="btnResume" type="button" ${changed?"disabled":""}>Lanjutkan permainan</button>
        ${changed?`<p class="hint">Jenjang atau jumlah tim berubah. Mulai permainan baru untuk memakai pilihan ini.</p>`:""}
        <button class="secondary wide ${newArmed?"danger":""}" id="btnNewGame" type="button">${newArmed?"Ya, hapus skor lama dan mulai":"Mulai permainan baru"}</button>
        ${newArmed?`<p class="hint">Semua tim kembali ke ${START} koin dan stok gudang ${STOCK0} kotak.</p>`:""}</div>`
    : `<div class="resume"><p class="eyebrow">Siap bermain</p><p class="resume-t">Level ${lv} · ${n} tim</p>
        <p class="hint">Atur nama dan gambar tim bila perlu, lalu mulai.</p>
        <button class="primary" id="btnStart" type="button">Mulai permainan</button></div>`;
  return `<section class="landing" aria-label="Pengaturan permainan">
    <div class="hero">
      <div class="hero-txt"><p class="eyebrow">PKM Logistik · Politeknik Transportasi Darat Bali</p>
        <h2>Kirim es krim dari gudang dingin ke toko sebelum meleleh</h2>
        <p>Setiap tim mengelola pengiriman selama enam hari dengan kalender lokal Bali. Pilih jenjang peserta dan jumlah tim, lalu mulai permainan.</p></div>
      ${start}
    </div>
    <div class="set-block"><h3>1. Jenjang peserta</h3>
      <div class="lv-cards">${[1,2,3].map(l=>`<button type="button" class="lv-card" data-act="lvl" data-v="${l}" aria-pressed="${lv===l}"><span class="lv-n">Level ${l}</span><span class="lv-j">${LVINFO[l].j}</span><span class="lv-d">${LVINFO[l].d}</span></button>`).join("")}</div></div>
    <div class="set-block"><h3>2. Jumlah tim</h3>
      <div class="seg" role="group" aria-label="Jumlah tim">${[2,3,4].map(k=>`<button type="button" data-act="nteam" data-v="${k}" aria-pressed="${n===k}">${k} tim</button>`).join("")}</div></div>
    <div class="set-block"><h3>3. Nama dan gambar tim</h3>${namesHtml()}</div>
    <details class="set-block rules-box"><summary><h3>Aturan main</h3></summary>${rulesHtml()}</details>
  </section>`;
}
function eventCardHtml(){
  const d=DAYS[S.day];
  if(d.closed) return `<div class="overlay"><section class="evcard" role="dialog" aria-modal="true" aria-labelledby="evT">
    <span class="badge">${dayIcon("moon").replace('width="30" height="30"','')}</span>
    <p class="eyebrow">Hari ke-${S.day+1} · Nyepi</p><h2 id="evT">Sepi, tanpa kendaraan</h2>
    <p>Hari ini tidak ada kartu kejadian. Es krim tetap aman di gudang dingin.</p>
    <button class="primary" id="btnGo" type="button">Lihat hasil</button>${undoHtml()}</section></div>`;
  const ev=EVENTS.find(e=>e.id===S.event); const a=affected(ev);
  const hit = ev.id==="lancar" ? `<div class="hit" style="color:var(--success)">Semua truk aman</div>`
    : !a.length ? `<div class="hit">Tidak ada tim yang terkena</div>`
    : `<div class="hit"><span>Tim terkena:</span>${a.map(i=>`<span class="tag">${fr(S.teams[i])}${esc(S.teams[i].name)}</span>`).join("")}</div>`;
  return `<div class="overlay"><section class="evcard" role="dialog" aria-modal="true" aria-labelledby="evT">
    <span class="badge">${evIcon(ev.icon)}</span>
    <p class="eyebrow">Kartu kejadian · Hari ke-${S.day+1}</p><h2 id="evT">${ev.title}</h2>
    <p>${ev.text}</p>${hit}
    <button class="primary" id="btnGo" type="button">Berangkatkan truk</button>${undoHtml()}</section></div>`;
}

/* ---------- render ---------- */
function setChips(){
  const txt = landing ? "Pengaturan" : S.phase==="end" ? "Rekap" : `Hari ${S.day+1} / ${DAYS.length}`;
  document.getElementById("chipDay").textContent = txt;
  document.getElementById("footPage").textContent = txt;
}
function render(){
  setChips();
  if(landing){ stage.innerHTML = landingHtml(); }
  else if(S.phase==="end"){ stage.innerHTML = recapHtml(); }
  else {
    stage.innerHTML =
      `<div class="top"><div class="daycol">${dayHtml()}${runHtml()}</div>${roadHtml()}</div>
       ${tabsHtml()}<section class="teams" style="--cols:${S.n}" aria-label="Keputusan tim">${S.teams.map(teamHtml).join("")}</section>`;
  }
  document.body.classList.toggle("dim", chartOpen || (!landing && S.phase==="event"));
  document.body.classList.toggle("on-landing", landing);
  layer.innerHTML = chartOpen ? chartHtml() : (!landing && S.phase==="event" ? eventCardHtml() : "");
  if(chartOpen){ const f=document.getElementById("btnCloseChart"); if(f && !layer.contains(document.activeElement)) f.focus(); }
  if(!landing && !chartOpen && S.phase==="event"){ const g=document.getElementById("btnGo"); if(g) g.focus(); }
  save();
  applyZoom();
}

/* ---------- zoom ---------- */
let zMode = "fit", zNum = 1;
try{ const z=localStorage.getItem(ZKEY); if(z){ if(z==="fit") zMode="fit"; else { zMode="num"; zNum=Math.min(1.6,Math.max(.5,+z)||1); } } }catch(e){}
if(isPhone() && zMode==="fit"){ zMode="num"; zNum=1; }
const box = ()=>document.querySelector("main .wrap");
function setZ(z){ box().style.zoom = z; document.getElementById("zVal").textContent = Math.round(z*100)+"%"; document.getElementById("zFit").setAttribute("aria-pressed", zMode==="fit"); }
function applyZoom(){
  if(zMode==="num" || isPhone() || S.phase==="end" || landing){ setZ(zMode==="num"?zNum:1); return; }
  const avail = innerHeight - document.querySelector("header").offsetHeight - document.querySelector("footer").offsetHeight - 6;
  let z=1; setZ(1);
  for(let k=0;k<3;k++){ const h=box().getBoundingClientRect().height/ z; const nz=Math.max(.55,Math.min(1.25, avail/h)); if(Math.abs(nz-z)<.01) break; z=nz; setZ(z); }
}
function bump(dir){
  const cur = parseFloat(box().style.zoom)||1;
  zMode="num"; zNum = Math.round(Math.min(1.6, Math.max(.5, cur + dir*.1))*10)/10;
  try{ localStorage.setItem(ZKEY, String(zNum)); }catch(e){}
  setZ(zNum);
}
document.getElementById("zIn").addEventListener("click", ()=>bump(1));
document.getElementById("zOut").addEventListener("click", ()=>bump(-1));
document.getElementById("zFit").addEventListener("click", ()=>{ zMode="fit"; try{ localStorage.setItem(ZKEY,"fit"); }catch(e){} applyZoom(); });
let rT; addEventListener("resize", ()=>{ clearTimeout(rT); rT=setTimeout(applyZoom,120); });

/* ---------- animation ---------- */
function animate(done){
  const d=DAYS[S.day];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(d.closed){ setTimeout(done, reduce?50:500); return; }
  const z = parseFloat(box().style.zoom)||1;
  S.teams.forEach((t,i)=>{
    const truck=document.getElementById("truck"+i), load=document.getElementById("load"+i), drops=document.getElementById("drops"+i), track=document.getElementById("track"+i);
    if(!truck) return;
    load.textContent=t.last.kirim;
    const dist = (track.getBoundingClientRect().width - truck.getBoundingClientRect().width)/z - 8;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ truck.style.transform=`translateX(${dist}px)`; }));
    const n=Math.min(12, t.last.leleh);
    for(let k=0;k<n && !reduce;k++){
      const f=(k+1)/(n+1), dp=document.createElement("span"); dp.className="drop";
      dp.style.left = (4 + f*dist + 6) + "px"; dp.style.animationDelay=(f*2.2)+"s";
      drops.appendChild(dp);
    }
    const t0=performance.now(), from=t.last.kirim, to=t.last.tiba;
    function tick(now){ const p=Math.min(1,(now-t0)/2400); load.textContent=Math.round(from-(from-to)*p); if(p<1) requestAnimationFrame(tick); }
    if(reduce) load.textContent=to; else requestAnimationFrame(tick);
  });
  setTimeout(done, reduce?100:2900);
}

/* ---------- events ---------- */
document.getElementById("btnChart").addEventListener("click", ()=>{ chartOpen=true; settingsOpen=false; render(); });
const pop=document.getElementById("audioPop"), btnA=document.getElementById("btnAudio");
function openPop(on){
  pop.hidden=!on; btnA.setAttribute("aria-expanded", on);
  if(on){ const r=btnA.getBoundingClientRect(); pop.style.top=(r.bottom+6)+"px"; pop.style.right=Math.max(8, innerWidth-r.right)+"px"; document.getElementById("swMute").focus(); }
}
btnA.addEventListener("click", e=>{ e.stopPropagation(); openPop(pop.hidden); });
document.addEventListener("click", e=>{ if(!pop.hidden && !pop.contains(e.target) && e.target!==btnA) openPop(false); });
document.getElementById("btnMute").addEventListener("click", ()=>{ aud.mute=!aud.mute; saveAud(); ctx(); applyAudio(); syncAudioUI(); });
document.getElementById("swMute").addEventListener("click", ()=>{ aud.mute=!aud.mute; saveAud(); ctx(); applyAudio(); syncAudioUI(); });
document.getElementById("swMusic").addEventListener("click", ()=>setMusic(!aud.music));
document.getElementById("swSfx").addEventListener("click", ()=>{ aud.sfx=!aud.sfx; saveAud(); ctx(); applyAudio(); syncAudioUI(); if(aud.sfx) sfx.coin(); });
document.getElementById("volMusic").addEventListener("input", e=>{ aud.mvol=+e.target.value; ctx(); applyAudio(); syncAudioUI(); });
document.getElementById("volMusic").addEventListener("change", saveAud);
document.getElementById("volSfx").addEventListener("input", e=>{ aud.svol=+e.target.value; ctx(); applyAudio(); syncAudioUI(); });
document.getElementById("volSfx").addEventListener("change", ()=>{ saveAud(); sfx.coin(); });
document.getElementById("btnTestSfx").addEventListener("click", ()=>{ sfx.horn(); sfx.coin(); });
syncAudioUI();
addEventListener("pointerdown", ()=>{ if(aud.music && !mTimer) startMusic(); });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopMusic(); else if(aud.music && AC && AC.state==="running") startMusic(); });
document.getElementById("btnSettings").addEventListener("click", ()=>{ chartOpen=false; landing=true; newArmed=false; pendLevel=null; pendN=null; pickFor=-1; render(); window.scrollTo({top:0}); });
document.getElementById("btnFull").addEventListener("click", ()=>{
  try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
});
addEventListener("keydown", e=>{
  if(e.key==="Escape" && !pop.hidden){ openPop(false); btnA.focus(); return; }
  if(e.key==="Escape" && chartOpen){ chartOpen=false; render(); document.getElementById("btnChart").focus(); return; }
  if(e.key==="Escape" && settingsOpen){ settingsOpen=false; render(); document.getElementById("btnSettings").focus(); }
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.tn!==undefined){ e.preventDefault(); e.target.blur(); }
});
function onClick(e){
  const b=e.target.closest("button");
  if(!b){ if(e.target.id==="setBack"){ settingsOpen=false; render(); } if(e.target.id==="chartBack"){ chartOpen=false; render(); } return; }
  const i=+b.dataset.i, A=b.dataset.act;
  if(A==="kminus"||A==="kplus"){ const t=S.teams[i], mk=maxKirim(t), cur=Math.min(t.dec.kirim,mk);
    t.dec.kirim = A==="kplus" ? Math.min(mk, Math.floor(cur/5)*5+5) : Math.max(0, Math.ceil(cur/5)*5-5); updDec(i); return; }
  if(A==="pminus"){ S.teams[i].dec.prod=Math.max(0,S.teams[i].dec.prod-5); updDec(i); return; }
  if(A==="pplus"){ S.teams[i].dec.prod=Math.min(100,S.teams[i].dec.prod+5); updDec(i); return; }
  if(A==="veh"){ const t=S.teams[i]; t.dec.veh=b.dataset.v; t.dec.kirim=Math.min(t.dec.kirim, maxKirim(t)); render(); return; }
  if(A==="route"){ S.teams[i].dec.route=b.dataset.v; render(); return; }
  if(A==="ready"){ S.teams[i].ready=!S.teams[i].ready; render(); return; }
  if(A==="tab"){ tab=i; render(); return; }
  if(A==="lvl"||A==="nteam"){
    const v=+b.dataset.v; newArmed=false;
    if(hasProgress()){ if(A==="lvl") pendLevel=v; else pendN=v; if(pendLevel===S.level) pendLevel=null; if(pendN===S.n) pendN=null; }
    else { S=fresh(A==="lvl"?v:S.level, A==="nteam"?v:S.n, keepNames(), keepEmo(), keepCols()); }
    render(); const fb=document.querySelector(`[data-act="${A}"][data-v="${v}"]`); if(fb) fb.focus(); return; }
  if(A==="pick"){ pickFor = pickFor===i ? -1 : i; render(); return; }
  if(A==="emo"){ S.teams[i].emoji = b.dataset.e || null; pickFor=-1; render(); const pb=document.querySelector(`[data-act="pick"][data-i="${i}"]`); if(pb) pb.focus(); return; }
  switch(b.id){
    case "btnRun": restored=false; undoArmed=false; runDay(); S.phase="event"; render();
      { const ev=EVENTS.find(e=>e.id===S.event); sfx.flip(); if(!ev || ev.id==="lancar" || ev.id==="rombongan") sfx.good(); else sfx.bad(); }
      return;
    case "btnShowEv": render(); return;
    case "btnGo": S.phase="running"; render(); if(!DAYS[S.day].closed) sfx.horn(); animate(()=>{ S.phase="result"; render(); if(!DAYS[S.day].closed){ sfx.horn(); sfx.coin(); } }); return;
    case "btnUndo": if(!undoArmed){ undoArmed=true; render(); document.getElementById("btnUndo").focus(); return; } doUndo(); return;
    case "btnUndoNo": undoArmed=false; render(); return;
    case "btnChart2": chartOpen=true; render(); return;
    case "btnCloseChart": chartOpen=false; render(); document.getElementById("btnChart").focus(); return;
    case "btnNext":
      restored=false;
      if(S.day===DAYS.length-1){ S.phase="end"; }
      else { S.day++; S.phase="decide"; S.event=null; S.prev=null; S.teams.forEach(t=>{ t.last=null; t.ready=false; }); morning(); }
      undoArmed=false;
      render(); window.scrollTo({top:0,behavior:"smooth"}); return;
    case "btnStart": landing=false; tab=0; render(); window.scrollTo({top:0}); return;
    case "btnResume": landing=false; render(); window.scrollTo({top:0}); return;
    case "btnNewGame":
      if(!newArmed){ newArmed=true; render(); document.getElementById("btnNewGame").focus(); return; }
      newArmed=false; tab=0; S=fresh(pendLevel||S.level, pendN||S.n, keepNames(), keepEmo(), keepCols()); pendLevel=null; pendN=null; landing=false; render(); window.scrollTo({top:0}); return;
    case "btnCloseSet": settingsOpen=false; render(); document.getElementById("btnSettings").focus(); return;
    case "btnRestart":
      if(!restartArmed){ restartArmed=true; render(); document.getElementById("btnRestart").focus(); return; }
      restartArmed=false; settingsOpen=false; restored=false; tab=0;
      S=fresh(pendLevel||S.level, pendN||S.n, keepNames(), keepEmo()); pendLevel=null; pendN=null; render(); return;
    case "btnShuffleColors": { const p=shuffledColors(); S.teams.forEach((t,k)=>t.c=p[k]); render(); return; }
    case "btnResetNames": S.teams.forEach((t,k)=>{ t.name=TEAMS[k].name; t.emoji=null; }); pickFor=-1; render(); return;
    case "btnKeep": restored=false; render(); return;
    case "btnNew": restored=false; tab=0; S=fresh(S.level,S.n,keepNames(),keepEmo()); render(); return;
    case "btnAgain": tab=0; S=fresh(S.level,S.n,keepNames(),keepEmo()); render(); window.scrollTo({top:0}); return;
    case "btnCopy": copyCsv(b); return;
  }
}
stage.addEventListener("click", onClick);
layer.addEventListener("click", onClick);
function onChange(e){
  const el=e.target;
  if(el.id==="selLevel"){ pendLevel=+el.value; restartArmed=false; render(); return; }
  if(el.id==="selTeams"){ pendN=+el.value; restartArmed=false; render(); return; } if(!el.dataset || el.dataset.tn===undefined) return;
  const i=+el.dataset.tn, v=el.value.replace(/\s+/g," ").trim();
  S.teams[i].name = v ? v.slice(0,20) : TEAMS[i].name;
  render();
  const nx=document.getElementById("tn"+(i+1)); if(nx) nx.focus();
}
layer.addEventListener("change", onChange);
stage.addEventListener("change", onChange);
function copyCsv(b){
  const head="tim,level,hari,nama_hari,kejadian,masuk_gudang,stok_gudang_awal,pesanan_pasokan,kendaraan,rute,dikirim,meleleh_jalan,meleleh_toko,terjual,permintaan,pemasukan,biaya_kirim,biaya_simpan,biaya_pesanan,koin_hari,total_koin,stok_gudang_akhir,stok_toko_akhir";
  const lines=S.teams.flatMap(t=>t.log.map(l=>[t.name,S.level,l.day,l.dayName,l.event,l.masuk,l.gudangAwal,l.prod,l.vehName,l.route,l.kirim,l.leleh,l.lost,l.sold,l.demand,l.income,l.veh,l.simpan,l.cost,l.net,l.koin,l.gudang,l.toko].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")));
  const csv=[head].concat(lines).join("\n");
  const box2=document.getElementById("csvBox"); box2.value=csv;
  const ok=()=>{ b.textContent="Tersalin"; setTimeout(()=>b.textContent="Salin data CSV",1800); };
  const fail=()=>{ box2.hidden=false; box2.focus(); box2.select(); b.textContent="Pilih teks di bawah lalu salin"; };
  try{ navigator.clipboard.writeText(csv).then(ok, fail); }catch(err){ fail(); }
}
function updDec(i){
  const t=S.teams[i];
  const k=document.getElementById("kirim"+i); if(k) k.innerHTML=kirimOut(t);
  const p=document.getElementById("prod"+i); if(p) p.innerHTML=prodOut(t);
  const ld=document.getElementById("load"+i); if(ld) ld.textContent=planKirim(t);
  save();
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>applyZoom());
render();

})();
</script>
